name: Sync FlClash stable releases
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: klash-upstream-sync
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare candidate and dispatch gated build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Klash release automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tool/klash/sync_upstream.py 2>&1 | tee klash-sync.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klash-upstream-sync-log
          path: klash-sync.log
          if-no-files-found: ignore
