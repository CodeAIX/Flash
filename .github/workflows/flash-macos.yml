name: Build Flash macOS

on:
  workflow_dispatch:
    inputs:
      intel_only:
        description: Build Intel only
        type: boolean
        default: false
      publish:
        description: Publish a versioned Flash release after both builds pass
        type: boolean
        default: false
      sync_pr:
        description: Upstream candidate PR to merge after both builds pass
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: flash-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.intel_only && '[{"arch":"x86_64","os":"macos-15-intel"}]' || '[{"arch":"arm64","os":"macos-latest"},{"arch":"x86_64","os":"macos-15-intel"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Validate version and release scope
        env:
          PUBLISH: ${{ inputs.publish }}
          INTEL_ONLY: ${{ inputs.intel_only }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          from pathlib import Path
          info = json.loads(Path('flash/upstream.json').read_text())
          upstream = tuple(map(int, info['tag'].lstrip('v').split('.')))
          expected = f'{upstream[0] + 1}.{upstream[1]}.{upstream[2]}'
          version = re.search(r'^version: ([0-9.]+)\+', Path('pubspec.yaml').read_text(), re.M)[1]
          assert version == info['flash_version'] == expected
          assert not (os.environ['PUBLISH'] == 'true' and os.environ['INTEL_ONLY'] == 'true'), 'Release requires both architectures'
          PYCODE
          python3 tool/flash/sync_upstream.py --validate-overlay
      - name: Select Xcode 26 SDK
        run: |
          set -euo pipefail
          selected=''
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then selected="$candidate"; fi
          done
          test -n "$selected"
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test test/common/tray_test.dart test/common/tray_menu_test.dart test/common/tray_lifecycle_test.dart test/manager/tray_manager_test.dart test/providers/outbound_ip_test.dart test/providers/route_state_test.dart test/providers/routed_probe_test.dart test/providers/ip_quality_test.dart plugins/tray/test
      - name: Intel renderer compatibility
        if: matrix.arch == 'x86_64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist
      - name: Build Flash
        run: flutter build macos --release --dart-define=SAFE_MODE=false --dart-define=FLASH_STATUS_ICON=true
      - name: Package Flash
        env:
          FLASH_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app=build/macos/Build/Products/Release/Flash.app
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = com.codeaix.flash
          lipo "$app/Contents/MacOS/Flash" -verify_arch "$FLASH_ARCH"
          lipo "$app/Contents/MacOS/FlClashCore" -verify_arch "$FLASH_ARCH"
          cp LICENSE FLASH-NOTICE.md "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p dist staging
          cp -R "$app" staging/
          ln -s /Applications staging/Applications
          cp LICENSE FLASH-NOTICE.md staging/
          version=$(python3 -c "import json; print(json.load(open('flash/upstream.json'))['flash_version'])")
          upstream=$(python3 -c "import json; print(json.load(open('flash/upstream.json'))['tag'])")
          core=$(git -C core/Clash.Meta rev-parse HEAD)
          printf 'Flash %s\nSource: https://github.com/%s/tree/%s\nUpstream: %s\nCore: %s\nArchitecture: %s\nAd-hoc signed, not notarized. Runtime acceptance pending.\n' "$version" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$upstream" "$core" "$FLASH_ARCH" > "staging/SOURCE_REVISION-$FLASH_ARCH.txt"
          cp "staging/SOURCE_REVISION-$FLASH_ARCH.txt" dist/
          name="Flash-$version-macos-$FLASH_ARCH"
          hdiutil create -volname "Flash $version" -srcfolder staging -ov -format UDZO "dist/$name.dmg"
          mkdir -p source-export
          git archive HEAD | tar -x -C source-export
          git -C core/Clash.Meta archive HEAD | tar -x -C source-export/core/Clash.Meta
          tar -czf "dist/$name-source.tar.gz" -C source-export .
          cp LICENSE FLASH-NOTICE.md dist/
          cd dist
          shasum -a 256 *.dmg *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Flash-macos-${{ matrix.arch }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish Flash release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Flash-macos-*
          path: artifacts
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_PR: ${{ inputs.sync_pr }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('flash/upstream.json'))['flash_version'])")
          upstream=$(python3 -c "import json; print(json.load(open('flash/upstream.json'))['tag'])")
          test -d artifacts/Flash-macos-arm64
          test -d artifacts/Flash-macos-x86_64
          mkdir -p dist
          for bucket in artifacts/Flash-macos-*; do
            (cd "$bucket" && sha256sum -c SHA256SUMS)
            cp "$bucket"/*.dmg "$bucket"/*-source.tar.gz "$bucket"/SOURCE_REVISION-*.txt dist/
          done
          cp LICENSE FLASH-NOTICE.md dist/
          (cd dist && sha256sum *.dmg *.tar.gz > SHA256SUMS)
          if [ -n "$SYNC_PR" ]; then
            gh pr merge "$SYNC_PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$GITHUB_SHA"
          fi
          printf '# Flash %s\n\nBased on FlClash %s, with Flash macOS country-code status icons.\n\nBackground: green = TUN enabled; blue = system proxy only; orange = neither. White country text = excellent IP quality; black = other/unknown. Stopped state uses the upstream-style glyph; lookup errors show a red F.\n\nDownload arm64 for Apple Silicon or x86_64 for Intel. Ad-hoc signed, not notarized. Normal-network runtime acceptance remains pending.\n\nEach binary has its corresponding source archive (including the pinned Core submodule), revision record, GPL notices and SHA256SUMS.\n' "$version" "$upstream" > release-notes.md
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
            test "$actual" = "$GITHUB_SHA"
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Flash $version" --notes-file release-notes.md --latest
          fi
