name: Build Klash macOS

on:
  workflow_dispatch:
    inputs:
      intel_only:
        description: Build Intel only
        type: boolean
        default: false
      publish:
        description: Publish a versioned Klash release after both builds pass
        type: boolean
        default: false
      sync_pr:
        description: Upstream candidate PR to merge after both builds pass
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: klash-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.intel_only && '[{"arch":"x86_64","os":"macos-15-intel"}]' || '[{"arch":"arm64","os":"macos-latest"},{"arch":"x86_64","os":"macos-15-intel"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Validate version and release scope
        env:
          PUBLISH: ${{ inputs.publish }}
          INTEL_ONLY: ${{ inputs.intel_only }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          from pathlib import Path
          info = json.loads(Path('klash/upstream.json').read_text())
          upstream = tuple(map(int, info['tag'].lstrip('v').split('.')))
          expected = f'{upstream[0] + 1}.{upstream[1]}.{upstream[2]}'
          version = re.search(r'^version: ([0-9.]+)\+', Path('pubspec.yaml').read_text(), re.M)[1]
          assert version == info['klash_version'] == expected
          assert not (os.environ['PUBLISH'] == 'true' and os.environ['INTEL_ONLY'] == 'true'), 'Release requires both architectures'
          PYCODE
          python3 tool/klash/sync_upstream.py --validate-overlay
      - name: Select Xcode 26 SDK
        run: |
          set -euo pipefail
          selected=''
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then selected="$candidate"; fi
          done
          test -n "$selected"
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test test/common/klash_monitor_test.dart test/common/protocol_test.dart test/common/request_test.dart test/common/dav_client_test.dart test/common/picker_test.dart test/common/backup_task_test.dart test/providers/backup_action_test.dart test/views/backup_and_restore_test.dart test/common/tray_test.dart test/common/tray_menu_test.dart test/common/tray_lifecycle_test.dart test/manager/tray_manager_test.dart test/providers/outbound_ip_test.dart test/providers/route_state_test.dart test/providers/routed_probe_test.dart test/providers/ip_quality_test.dart plugins/tray/test
      - name: Test native monitor menu
        run: |
          cp tool/klash/test_native_menu.swift /tmp/main.swift
          swiftc plugins/tray/macos/tray/Sources/tray/TrayMenuItemView.swift plugins/tray/macos/tray/Sources/tray/TrayMenu.swift /tmp/main.swift -o /tmp/klash-native-menu-test
          /tmp/klash-native-menu-test
      - name: Test status glyph rendering
        run: |
          cp tool/klash/test_status_image.swift /tmp/main.swift
          swiftc plugins/tray/macos/tray/Sources/tray/KlashStatusImage.swift /tmp/main.swift -o /tmp/klash-status-image-test
          /tmp/klash-status-image-test
      - name: Intel renderer compatibility
        if: matrix.arch == 'x86_64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist
      - name: Build Klash
        run: flutter build macos --release --dart-define=SAFE_MODE=false --dart-define=KLASH_STATUS_ICON=true --dart-define=APP_ENV=stable
      - name: Package Klash
        env:
          KLASH_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app=build/macos/Build/Products/Release/Klash.app
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = com.codeaix.klash
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$app/Contents/Info.plist")" = Klash
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$app/Contents/Info.plist")" = Klash
          lipo "$app/Contents/MacOS/Klash" -verify_arch "$KLASH_ARCH"
          lipo "$app/Contents/MacOS/FlClashCore" -verify_arch "$KLASH_ARCH"
          cp LICENSE KLASH-NOTICE.md "$app/Contents/Resources/"
          codesign --force --deep --sign - --preserve-metadata=entitlements "$app"
          codesign --force --sign - --entitlements macos/Runner/Release.entitlements "$app"
          codesign -d --entitlements - --xml "$app" > entitlements.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print com.apple.security.files.user-selected.read-write' entitlements.plist)" = true
          codesign --verify --deep --strict "$app"
          mkdir -p dist staging
          cp -R "$app" staging/
          ln -s /Applications staging/Applications
          cp LICENSE KLASH-NOTICE.md staging/
          version=$(python3 -c "import json; info=json.load(open('klash/upstream.json')); build=next(line.split('+')[1].strip() for line in open('pubspec.yaml') if line.startswith('version:')); print(info['klash_version'] + ('+' + build if info.get('release_revision') else ''))")
          upstream=$(python3 -c "import json; print(json.load(open('klash/upstream.json'))['tag'])")
          core=$(git -C core/Clash.Meta rev-parse HEAD)
          printf 'Klash %s\nSource: https://github.com/%s/tree/%s\nUpstream: %s\nCore: %s\nArchitecture: %s\nAd-hoc signed, not notarized. Runtime acceptance pending.\n' "$version" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$upstream" "$core" "$KLASH_ARCH" > "staging/SOURCE_REVISION-$KLASH_ARCH.txt"
          cp "staging/SOURCE_REVISION-$KLASH_ARCH.txt" dist/
          name="Klash-$version-macos-$KLASH_ARCH"
          hdiutil create -volname "Klash $version" -srcfolder staging -ov -format UDZO "dist/$name.dmg"
          mkdir -p source-export
          git archive HEAD | tar -x -C source-export
          git -C core/Clash.Meta archive HEAD | tar -x -C source-export/core/Clash.Meta
          git -C plugins/prism_ui archive HEAD | tar -x -C source-export/plugins/prism_ui
          tar -czf "dist/$name-source.tar.gz" -C source-export .
          cp LICENSE KLASH-NOTICE.md dist/
          cd dist
          shasum -a 256 *.dmg *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Klash-macos-${{ matrix.arch }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish Klash release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Klash-macos-*
          path: artifacts
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_PR: ${{ inputs.sync_pr }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; info=json.load(open('klash/upstream.json')); build=next(line.split('+')[1].strip() for line in open('pubspec.yaml') if line.startswith('version:')); print(info['klash_version'] + ('+' + build if info.get('release_revision') else ''))")
          upstream=$(python3 -c "import json; print(json.load(open('klash/upstream.json'))['tag'])")
          test -d artifacts/Klash-macos-arm64
          test -d artifacts/Klash-macos-x86_64
          mkdir -p dist
          for bucket in artifacts/Klash-macos-*; do
            (cd "$bucket" && sha256sum -c SHA256SUMS)
            cp "$bucket"/*.dmg "$bucket"/*-source.tar.gz "$bucket"/SOURCE_REVISION-*.txt dist/
          done
          cp LICENSE KLASH-NOTICE.md dist/
          (cd dist && sha256sum *.dmg *.tar.gz > SHA256SUMS)
          if [ -n "$SYNC_PR" ]; then
            gh pr merge "$SYNC_PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$GITHUB_SHA"
          fi
          cat > release-notes.md <<EOF
          # Klash $version

          Klash 是 Flash 的新名称，继续基于 FlClash $upstream。保留绿色渐变应用图标、状态栏样式、监测目标和代理操作。

          - 国家码及红色 F 改为预先准备的字形路径，重绘不再调用 NSString 文字排版，规避已观测到的 CoreText 崩溃链。校准 12.5pt Heavy 的字重和基线，缺字时降级为可见 Logo。
          - 应用、Bundle ID、安装包、更新源、说明和七语言文案更名为 Klash。新身份为 com.codeaix.klash，首次使用通过 Flash 导出的本地备份恢复；不自动复制活动数据库或覆盖旧客户端数据，监测目标可重新选择。
          - 新远程备份写入 /Klash；恢复依次只读尝试 /Klash、/Flash、/FlClash，仅对 404/409 回退，其他错误保留。
          - 绿色=TUN、蓝色=仅系统代理、橙色=均未开启；白色国家码=优秀 IP，黑色=其他或未知。◎ 仍只设置监测对象，名称保留原版节点切换。

          Klash is the new name of Flash. Status glyphs use prepared paths instead of NSString text layout during redraw, with calibrated weight/baseline and a visible fallback. Monitoring, proxy controls, icon artwork and all status colors are retained. Product identity, package names, update links and documentation use Klash.

          The new bundle ID has separate app data. Export a backup from Flash and restore it in Klash; the old data is untouched. WebDAV restore prefers Klash, then reads Flash and FlClash backups on 404/409 only. Do not run both clients in normal network mode at the same time.

          Download arm64 for Apple Silicon or x86_64 for Intel. Packages are ad-hoc signed and not notarized. Both architectures pass analysis, regression tests, native menu tests and status glyph rendering tests. These checks do not replace long-running sleep/wake and display-switch acceptance.

          Each binary includes its matching complete source archive (pinned Core and prism_ui), GPL notices, source revision and SHA256SUMS. The independent overlay is maintained under klash/ and tool/klash/; upstream conflicts stop automatic publication. Historical Flash releases remain available.
          EOF
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
            test "$actual" = "$GITHUB_SHA"
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Klash $version" --notes-file release-notes.md --latest
          fi
