name: Build Flash macOS

on:
  workflow_dispatch:
    inputs:
      intel_only:
        description: Build Intel only
        type: boolean
        default: false
      publish:
        description: Publish a versioned Flash release after both builds pass
        type: boolean
        default: false
      sync_pr:
        description: Upstream candidate PR to merge after both builds pass
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: flash-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.intel_only && '[{"arch":"x86_64","os":"macos-15-intel"}]' || '[{"arch":"arm64","os":"macos-latest"},{"arch":"x86_64","os":"macos-15-intel"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Validate version and release scope
        env:
          PUBLISH: ${{ inputs.publish }}
          INTEL_ONLY: ${{ inputs.intel_only }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          from pathlib import Path
          info = json.loads(Path('flash/upstream.json').read_text())
          upstream = tuple(map(int, info['tag'].lstrip('v').split('.')))
          expected = f'{upstream[0] + 1}.{upstream[1]}.{upstream[2]}'
          version = re.search(r'^version: ([0-9.]+)\+', Path('pubspec.yaml').read_text(), re.M)[1]
          assert version == info['flash_version'] == expected
          assert not (os.environ['PUBLISH'] == 'true' and os.environ['INTEL_ONLY'] == 'true'), 'Release requires both architectures'
          PYCODE
          python3 tool/flash/sync_upstream.py --validate-overlay
      - name: Select Xcode 26 SDK
        run: |
          set -euo pipefail
          selected=''
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then selected="$candidate"; fi
          done
          test -n "$selected"
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test test/common/flash_monitor_test.dart test/common/request_test.dart test/common/dav_client_test.dart test/common/picker_test.dart test/common/backup_task_test.dart test/providers/backup_action_test.dart test/views/backup_and_restore_test.dart test/common/tray_test.dart test/common/tray_menu_test.dart test/common/tray_lifecycle_test.dart test/manager/tray_manager_test.dart test/providers/outbound_ip_test.dart test/providers/route_state_test.dart test/providers/routed_probe_test.dart test/providers/ip_quality_test.dart plugins/tray/test
      - name: Test native monitor menu
        run: |
          cp tool/flash/test_native_menu.swift /tmp/main.swift
          swiftc plugins/tray/macos/tray/Sources/tray/TrayMenuItemView.swift plugins/tray/macos/tray/Sources/tray/TrayMenu.swift /tmp/main.swift -o /tmp/flash-native-menu-test
          /tmp/flash-native-menu-test
      - name: Intel renderer compatibility
        if: matrix.arch == 'x86_64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist
      - name: Build Flash
        run: flutter build macos --release --dart-define=SAFE_MODE=false --dart-define=FLASH_STATUS_ICON=true --dart-define=APP_ENV=stable
      - name: Package Flash
        env:
          FLASH_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app=build/macos/Build/Products/Release/Flash.app
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = com.codeaix.flash
          lipo "$app/Contents/MacOS/Flash" -verify_arch "$FLASH_ARCH"
          lipo "$app/Contents/MacOS/FlClashCore" -verify_arch "$FLASH_ARCH"
          cp LICENSE FLASH-NOTICE.md "$app/Contents/Resources/"
          codesign --force --deep --sign - --preserve-metadata=entitlements "$app"
          codesign --force --sign - --entitlements macos/Runner/Release.entitlements "$app"
          codesign -d --entitlements - --xml "$app" > entitlements.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print com.apple.security.files.user-selected.read-write' entitlements.plist)" = true
          codesign --verify --deep --strict "$app"
          mkdir -p dist staging
          cp -R "$app" staging/
          ln -s /Applications staging/Applications
          cp LICENSE FLASH-NOTICE.md staging/
          version=$(python3 -c "import json; info=json.load(open('flash/upstream.json')); build=next(line.split('+')[1].strip() for line in open('pubspec.yaml') if line.startswith('version:')); print(info['flash_version'] + ('+' + build if info.get('release_revision') else ''))")
          upstream=$(python3 -c "import json; print(json.load(open('flash/upstream.json'))['tag'])")
          core=$(git -C core/Clash.Meta rev-parse HEAD)
          printf 'Flash %s\nSource: https://github.com/%s/tree/%s\nUpstream: %s\nCore: %s\nArchitecture: %s\nAd-hoc signed, not notarized. Runtime acceptance pending.\n' "$version" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$upstream" "$core" "$FLASH_ARCH" > "staging/SOURCE_REVISION-$FLASH_ARCH.txt"
          cp "staging/SOURCE_REVISION-$FLASH_ARCH.txt" dist/
          name="Flash-$version-macos-$FLASH_ARCH"
          hdiutil create -volname "Flash $version" -srcfolder staging -ov -format UDZO "dist/$name.dmg"
          mkdir -p source-export
          git archive HEAD | tar -x -C source-export
          git -C core/Clash.Meta archive HEAD | tar -x -C source-export/core/Clash.Meta
          git -C plugins/prism_ui archive HEAD | tar -x -C source-export/plugins/prism_ui
          tar -czf "dist/$name-source.tar.gz" -C source-export .
          cp LICENSE FLASH-NOTICE.md dist/
          cd dist
          shasum -a 256 *.dmg *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Flash-macos-${{ matrix.arch }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish Flash release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Flash-macos-*
          path: artifacts
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_PR: ${{ inputs.sync_pr }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; info=json.load(open('flash/upstream.json')); build=next(line.split('+')[1].strip() for line in open('pubspec.yaml') if line.startswith('version:')); print(info['flash_version'] + ('+' + build if info.get('release_revision') else ''))")
          upstream=$(python3 -c "import json; print(json.load(open('flash/upstream.json'))['tag'])")
          test -d artifacts/Flash-macos-arm64
          test -d artifacts/Flash-macos-x86_64
          mkdir -p dist
          for bucket in artifacts/Flash-macos-*; do
            (cd "$bucket" && sha256sum -c SHA256SUMS)
            cp "$bucket"/*.dmg "$bucket"/*-source.tar.gz "$bucket"/SOURCE_REVISION-*.txt dist/
          done
          cp LICENSE FLASH-NOTICE.md dist/
          (cd dist && sha256sum *.dmg *.tar.gz > SHA256SUMS)
          if [ -n "$SYNC_PR" ]; then
            gh pr merge "$SYNC_PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$GITHUB_SHA"
          fi
          cat > release-notes.md <<EOF
          # Flash $version

          基于 FlClash $upstream，应用版本 1.9.3，构建号 2026110502。

          - 在原版状态栏节点列表中加入独立 ◎ 监测按钮，可选择节点组、嵌套自动组或具体节点。移除顶部重复的监测目标选择树。
          - 节点名称保留原版代理切换操作；组箭头照常展开。◎ 只设置监测对象，当前目标以实心标记常驻。
          - 保留绿色=TUN、蓝色=仅系统代理、橙色=均未开启的背景逻辑。国家码白色=优秀 IP，黑色=其他或未知质量。
          - 底部“监测选项”提供当前目标、按分流规则和立即刷新出口与质量。支持高亮目标后 Option+Return，以及命名无障碍操作。
          - 独立补丁、双语说明及七语言文案已更新，后续上游同步继续通过补丁重建和双架构构建门禁。

          Independent ◎ buttons are integrated into the original proxy menu for groups, nested automatic groups, and individual nodes. Primary proxy-switch actions and all status colors are preserved. Monitoring options provide refresh and rule routing; Option+Return and named accessibility actions are available.

          Download arm64 for Apple Silicon or x86_64 for Intel. Packages are ad-hoc signed and not notarized. Both builds pass analysis, regression tests and the native menu harness. An isolated native UI test changed the monitor with zero proxy-switch callbacks; this does not replace acceptance with your own configuration.

          Each binary includes a matching source archive with pinned Core and prism_ui sources, revision record, GPL notices and SHA256SUMS. Existing branding, backup compatibility and stable-channel fixes are retained. See the repository READMEs for the complete status legend and behavior.
          EOF
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
            test "$actual" = "$GITHUB_SHA"
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Flash $version" --notes-file release-notes.md --latest
          fi
