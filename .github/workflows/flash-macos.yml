name: Build Flash macOS

on:
  push:
    branches: [codex/flash-macos]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flash-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
          - arch: x86_64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test test/common/tray_test.dart test/common/tray_menu_test.dart test/common/tray_lifecycle_test.dart test/manager/tray_manager_test.dart test/providers/outbound_ip_test.dart test/providers/route_state_test.dart test/providers/routed_probe_test.dart plugins/tray/test
      - name: Intel renderer compatibility
        if: matrix.arch == 'x86_64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist
      - name: Build Flash
        run: flutter build macos --release --no-codesign --dart-define=SAFE_MODE=false --dart-define=FLASH_STATUS_ICON=true
      - name: Package development preview
        env:
          FLASH_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app=build/macos/Build/Products/Release/Flash.app
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = com.codeaix.flash
          lipo -verify_arch "$FLASH_ARCH" "$app/Contents/MacOS/Flash"
          lipo -verify_arch "$FLASH_ARCH" "$app/Contents/MacOS/FlClashCore"
          cp LICENSE FLASH-NOTICE.md "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p dist staging
          cp -R "$app" staging/
          ln -s /Applications staging/Applications
          cp LICENSE FLASH-NOTICE.md staging/
          printf 'Flash development preview\nSource: https://github.com/%s/tree/%s\nUpstream: v0.9.1 (8d4f9744948751f1273fe871e1d05276fac09b0e)\nCore: 8380d0e7462f061a964323e9bf3129a236fcc5d5\nArchitecture: %s\nAd-hoc signed, not notarized. Normal network mode; runtime acceptance pending.\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$FLASH_ARCH" > staging/SOURCE_REVISION.txt
          cp staging/SOURCE_REVISION.txt dist/
          name="Flash-0.9.1-flash.1-macos-$FLASH_ARCH-preview"
          hdiutil create -volname 'Flash Preview' -srcfolder staging -ov -format UDZO "dist/$name.dmg"
          mkdir -p source-export
          git archive HEAD | tar -x -C source-export
          git -C core/Clash.Meta archive HEAD | tar -x -C source-export/core/Clash.Meta
          tar -czf "dist/$name-source.tar.gz" -C source-export .
          cp LICENSE FLASH-NOTICE.md dist/
          cd dist
          shasum -a 256 *.dmg *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Flash-macos-${{ matrix.arch }}-preview
          path: dist/
          retention-days: 30
          if-no-files-found: error
